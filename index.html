<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>División de Cuartos — JW Marriott</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuartos">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:      #111827;
    --navy-mid:  #1c2a42;
    --navy-card: #1e2f4a;
    --navy-lite: #243354;
    --gold:      #c9a96e;
    --gold-dim:  #9a7a4a;
    --white:     #f0ede8;
    --muted:     #8a9ab5;
    --border:    rgba(255,255,255,0.08);
    --border-gold: rgba(201,169,110,0.3);
    --green:     #4caf7d;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }

  /* HEADER */
  .app-header {
    background: var(--navy-mid);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
  }

  .jw-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    line-height: 1;
  }

  .jw-logo .sub {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.52rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-top: 0.2rem;
  }

  .header-divider { width: 1px; height: 28px; background: var(--border); }

  .header-title {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.25rem;
    gap: 1.25rem;
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }

  .page-title { width: 100%; }

  .page-title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 600;
    line-height: 1;
    color: var(--white);
  }

  .page-title h1 span { color: var(--gold); }

  .page-title p {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  /* CARD */
  .card {
    width: 100%;
    background: var(--navy-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem;
  }

  .card-label {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  /* INPUT ROW */
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .field-label {
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 0.5rem;
  }

  .stepper {
    display: flex;
    align-items: center;
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .stepper:focus-within { border-color: var(--border-gold); }

  .stepper button {
    background: none;
    border: none;
    cursor: pointer;
    width: 42px;
    height: 52px;
    font-size: 1.2rem;
    color: var(--muted);
    transition: color 0.12s, background 0.12s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .stepper button:active { background: var(--navy-lite); color: var(--gold); }

  .stepper input {
    flex: 1;
    text-align: center;
    border: none;
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--white);
    padding: 0;
    min-width: 0;
    appearance: textfield;
    -moz-appearance: textfield;
  }

  .stepper input::-webkit-inner-spin-button,
  .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .stepper input:focus { outline: none; }

  /* GOLD DIVIDER */
  .gold-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border-gold), transparent);
  }

  /* RESULT CARD */
  .result-card {
    width: 100%;
    background: var(--navy-card);
    border: 1px solid var(--border-gold);
    border-radius: 4px;
    padding: 1.5rem;
    animation: fadeUp 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, var(--gold-dim), var(--gold), var(--gold-dim));
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .result-eyebrow {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .result-main {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.2rem;
  }

  .result-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4rem;
    font-weight: 600;
    line-height: 1;
    color: var(--white);
  }

  .result-unit {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.4;
  }

  .result-desc {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
    letter-spacing: 0.04em;
  }

  .breakdown {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    display: grid;
    gap: 0.55rem;
  }

  .breakdown-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
  }

  .breakdown-row .lbl { color: var(--muted); }
  .breakdown-row .val { font-weight: 500; color: var(--white); }
  .breakdown-row .val.ok   { color: var(--green); }
  .breakdown-row .val.warn { color: var(--gold); }

  .remainder-bar { margin-top: 1rem; }

  .remainder-bar-label {
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }

  .bar-track {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(to right, var(--gold-dim), var(--gold));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  .chips-label {
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 1.25rem 0 0.6rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }

  .people-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .chip {
    background: var(--navy-lite);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.3rem 0.7rem;
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    animation: popIn 0.2s ease both;
  }

  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .chip .num { color: var(--gold); font-weight: 500; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
    padding: 2rem 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  footer {
    text-align: center;
    font-size: 0.58rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 1.5rem;
    border-top: 1px solid var(--border);
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="jw-logo">
    JW Ordering
    <span class="sub">Houston Downtown · Housekeeping</span>
  </div>
  <div class="header-divider"></div>
  <span class="header-title">División de Cuartos</span>
</div>

<div class="main">

  <div class="page-title">
    <h1>División de <span>Cuartos</span></h1>
    <p>Distribución por persona · Housekeeping</p>
  </div>

  <div class="card">
    <p class="card-label">Ingresa los valores</p>
    <div class="input-row">
      <div class="field">
        <label class="field-label">Cuartos totales</label>
        <div class="stepper">
          <button onclick="step('a',-1)">−</button>
          <input type="number" id="input-a" value="50" min="1" oninput="calc()">
          <button onclick="step('a',1)">+</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Personas</label>
        <div class="stepper">
          <button onclick="step('b',-1)">−</button>
          <input type="number" id="input-b" value="5" min="1" oninput="calc()">
          <button onclick="step('b',1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="gold-divider"></div>

  <div id="result-area" style="width:100%">
    <div class="result-card">
      <p class="empty-state">Ingresa los valores para calcular</p>
    </div>
  </div>

</div>

<footer>JW Marriott Houston Downtown &nbsp;·&nbsp; Housekeeping Tools</footer>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }

  function step(id, delta) {
    const el = document.getElementById('input-' + id);
    el.value = Math.max(1, (parseInt(el.value) || 0) + delta);
    calc();
  }

  function calc() {
    const rooms  = parseInt(document.getElementById('input-a').value) || 0;
    const people = parseInt(document.getElementById('input-b').value) || 0;
    const area   = document.getElementById('result-area');

    if (!rooms || !people) {
      area.innerHTML = `<div class="result-card"><p class="empty-state">Ingresa valores mayores a cero</p></div>`;
      return;
    }

    const base      = Math.floor(rooms / people);
    const remainder = rooms % people;
    const pct       = Math.round((remainder / rooms) * 100);

    let chips = '';
    for (let i = 0; i < people; i++) {
      const n = base + (i < remainder ? 1 : 0);
      chips += `<span class="chip" style="animation-delay:${i * 0.03}s">Persona ${i+1} &nbsp;<span class="num">${n}</span></span>`;
    }

    area.innerHTML = `
      <div class="result-card">
        <p class="result-eyebrow">Resultado</p>
        <div class="result-main">
          <span class="result-number">${base}</span>
          <span class="result-unit">cuartos<br>por persona</span>
        </div>
        <p class="result-desc">${remainder > 0
          ? `${remainder} persona${remainder > 1 ? 's reciben' : ' recibe'} un cuarto adicional`
          : 'División exacta — sin residuo ✓'}</p>
        <div class="breakdown">
          <div class="breakdown-row"><span class="lbl">Total cuartos</span><span class="val">${rooms}</span></div>
          <div class="breakdown-row"><span class="lbl">Personas</span><span class="val">${people}</span></div>
          <div class="breakdown-row"><span class="lbl">Base por persona</span><span class="val">${base}</span></div>
          <div class="breakdown-row"><span class="lbl">Residuo</span>
            <span class="val ${remainder === 0 ? 'ok' : 'warn'}">${remainder} cuarto${remainder !== 1 ? 's' : ''}</span>
          </div>
        </div>
        ${remainder > 0 ? `
        <div class="remainder-bar">
          <div class="remainder-bar-label"><span>Cuartos adicionales</span><span>${pct}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>` : ''}
        <p class="chips-label">Distribución por persona</p>
        <div class="people-chips">${chips}</div>
      </div>`;
  }

  calc();
</script>
</body>
</html>
